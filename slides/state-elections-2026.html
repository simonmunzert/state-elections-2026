# The centre is not cracking.
&lt;html&gt;&lt;div style='float:left'&gt;&lt;/div&gt;&lt;hr color='#EB811B' size=1px style="width:1000px; margin:auto;"/&gt;&lt;/html&gt;


---
# CDU/CSU and SPD have been losing ground since the 1980s

.fig[&lt;img src="pics/analysis/01_centre_share.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Combined share: West &lt;b style="color:#cc0065"&gt;89%&lt;/b&gt; in the 1970s → &lt;b style="color:#cc0065"&gt;54%&lt;/b&gt; in the 2020s
- East: &lt;b style="color:#cc0065"&gt;68%&lt;/b&gt; in the 1990s → &lt;b style="color:#cc0065"&gt;39%&lt;/b&gt; today
- 1955–2015: the largest party at &lt;b style="color:#cc0065"&gt;all 193&lt;/b&gt; state elections was CDU/CSU or SPD. Since 2016: &lt;b style="color:#cc0065"&gt;8 of 38&lt;/b&gt; went elsewhere
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation.&lt;/div&gt;


---
# State parliaments are more fragmented than ever

.fig[&lt;img src="pics/analysis/01_fragmentation_enp.png"&gt;]

.formula[
&lt;b&gt;Effective number of parties&lt;/b&gt; (Laakso &amp; Taagepera 1979)

`$$N = \frac{1}{\sum_{i=1}^{n} s_i^2}$$`

where `\(s_i\)` is party `\(i\)`'s share of seats
]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Around &lt;b style="color:#cc0065"&gt;2.2&lt;/b&gt; in the West of the 1970s
- &lt;b style="color:#cc0065"&gt;3.5 to 4.7&lt;/b&gt; in the parliaments elected in 2026
- But: &lt;b style="color:#cc0065"&gt;shrinking as AfD becomes dominant&lt;/b&gt; in the East, FDP drops out
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation.&lt;/div&gt;


---
class: inverse, center, middle

&lt;span class="section-no"&gt;2&lt;/span&gt;

# The far right is not a new kid on the block.
&lt;html&gt;&lt;div style='float:left'&gt;&lt;/div&gt;&lt;hr color='#EB811B' size=1px style="width:1000px; margin:auto;"/&gt;&lt;/html&gt;


---
# The far right in state parliaments is not new ...

.fig[&lt;img src="pics/analysis/02_far_right_timeline.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- NPD in &lt;b style="color:#cc0065"&gt;seven Landtage at once&lt;/b&gt; in 1968–70
- DVU, REP and Schill in the 1990s and 2000s, mostly for a single term
- The AfD since 2014: &lt;b style="color:#cc0065"&gt;all 16&lt;/b&gt; states
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation. Bremen: DVU/BIW seats via the separate Bremerhaven threshold.&lt;/div&gt;


---
# ... but the AfD is a different animal

.fig[&lt;img src="pics/analysis/02_far_right_strength.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Before the AfD: &lt;b style="color:#cc0065"&gt;34&lt;/b&gt; entries, average &lt;b style="color:#cc0065"&gt;6.7%&lt;/b&gt;, best 19.4% (Schill, Hamburg 2001), only &lt;b style="color:#cc0065"&gt;1 in 3&lt;/b&gt; re-elected
- The AfD: &lt;b style="color:#cc0065"&gt;41&lt;/b&gt; entries, average &lt;b style="color:#cc0065"&gt;15%&lt;/b&gt;, &lt;b style="color:#cc0065"&gt;9 in 10&lt;/b&gt; re-elected, always stronger
- 2026: &lt;b style="color:#cc0065"&gt;47%&lt;/b&gt; of seats in Saxony-Anhalt, 45% in MV
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation.&lt;/div&gt;


---
# The recent AfD surge is smaller than it looks

.fig[&lt;img src="pics/analysis/02_afd_vs_btw25.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Against the previous state election: &lt;b style="color:#cc0065"&gt;+23&lt;/b&gt;, +21.5 and +7 points in the September elections
- Against the February 2025 federal result in the same state: &lt;b style="color:#cc0065"&gt;+6.7&lt;/b&gt;, +3.2 and +1.1
- In the March elections the AfD even &lt;b style="color:#cc0065"&gt;underperformed&lt;/b&gt; its federal result
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, &lt;a href="https://www.bundeswahlleiterin.de/bundestagswahlen/2025/ergebnisse.html"&gt;Bundeswahlleiterin&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://bsky.app/profile/nilssteiner.bsky.social/post/3mvy5n3azt22p"&gt;Nils Steiner&lt;/a&gt;.&lt;/div&gt;

class: inverse, center, middle

&lt;span class="section-no"&gt;3&lt;/span&gt;

# Age, education, and geography are defining cleavages.
&lt;html&gt;&lt;div style='float:left'&gt;&lt;/div&gt;&lt;hr color='#EB811B' size=1px style="width:1000px; margin:auto;"/&gt;&lt;/html&gt;


---
# Support for the centre is dying out

.fig[&lt;img src="pics/analysis/03_age.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- CDU under 25: &lt;b style="color:#cc0065"&gt;5%&lt;/b&gt; in Saxony-Anhalt, &lt;b style="color:#cc0065"&gt;1%&lt;/b&gt; in MV; the SPD's best group is the over-70s
- The AfD peaks at &lt;b style="color:#cc0065"&gt;35–59&lt;/b&gt; everywhere and is weakest among the oldest
- Berlin under 35: &lt;b style="color:#cc0065"&gt;43–49%&lt;/b&gt; Die Linke
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.kas.de/de/monitor-wahl-und-sozialforschung"&gt;infratest dimap exit polls, via KAS Wahlanalysen&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://www.zeit.de/politik/deutschland/2026-09/wahlverhalten-junge-menschen-ostdeutschland-volksparteien-cdu-spd"&gt;Thorsten Faas&lt;/a&gt;.&lt;/div&gt;


---
# The AfD's steep education gradient

.fig[&lt;img src="pics/analysis/03_education.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- AfD by education (low / medium / high): &lt;b style="color:#cc0065"&gt;57 / 52 / 30&lt;/b&gt; in Saxony-Anhalt, 46 / 47 / 25 in MV, 26 / 28 / 10 in Berlin
- The Linke and Greens run the other way
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.kas.de/de/monitor-wahl-und-sozialforschung"&gt;infratest dimap exit polls, via KAS Wahlanalysen&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://bsky.app/profile/tabouchadi.bsky.social/post/3mvy3gz4vfc2w"&gt;Tarik Abou-Chadi&lt;/a&gt;.&lt;/div&gt;


---
# Village vs. city: the AfD vote falls with municipality size

.fig[&lt;img src="pics/analysis/03_urban_rural_afd_by_size.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Village-to-city gap: &lt;b style="color:#cc0065"&gt;16–24 points&lt;/b&gt; in the East, &lt;b style="color:#cc0065"&gt;7–10&lt;/b&gt; in the West
- Saxony-Anhalt: 51% in villages under 2,000, 31% in the big cities
- Only the AfD has this gradient; Greens and Linke are its mirror image
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.german-elections.com/"&gt;GERDA&lt;/a&gt;, &lt;a href="https://wahlen.mvnet.de/wahl/land"&gt;Landeswahlleitung MV&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://juliuskoelzer.de/saxony-anhalt-2026-en/"&gt;Julius Kölzer&lt;/a&gt;.&lt;/div&gt;


---
# Berlin: “The Ring is the new Wall”

.fig.sq[&lt;img src="pics/analysis/03_berlin_map.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Left bloc inside the S-Bahn-Ring: &lt;b style="color:#cc0065"&gt;67%&lt;/b&gt; East, &lt;b style="color:#cc0065"&gt;68%&lt;/b&gt; West. Outside: 45% East, 47% West
- The AfD still carries the old border: 25% East outside, 16% West outside
- The CDU remains strong in the South-West and North-West
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlen-berlin.de/wahlen/BE2026/AFSPRAES/agh/downloads.html"&gt;Landeswahlleiterin Berlin / AfS Berlin-Brandenburg&lt;/a&gt;, &lt;a href="https://gdi.berlin.de/"&gt;gdi.berlin.de&lt;/a&gt;, OpenStreetMap, own compilation. Inspired by: &lt;a href="https://interaktiv.tagesspiegel.de/lab/der-berliner-mamdani-effekt-jung-migrantisch-zentrumsnah-wo-die-linke-stark-geworden-ist/"&gt;Tagesspiegel / Julius Kölzer&lt;/a&gt;.&lt;/div&gt;

---
# Berlin: “The Ring is the new Wall”

.fig[&lt;img src="pics/analysis/03_berlin_ring.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- Left bloc inside the S-Bahn-Ring: &lt;b style="color:#cc0065"&gt;67%&lt;/b&gt; East, &lt;b style="color:#cc0065"&gt;68%&lt;/b&gt; West. Outside: 45% East, 47% West
- The AfD still carries the old border: 25% East outside, 16% West outside
- The CDU remains strong in the South-West and North-West
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlen-berlin.de/wahlen/BE2026/AFSPRAES/agh/downloads.html"&gt;Landeswahlleiterin Berlin / AfS Berlin-Brandenburg&lt;/a&gt;, &lt;a href="https://gdi.berlin.de/"&gt;gdi.berlin.de&lt;/a&gt;, OpenStreetMap, own compilation. Inspired by: &lt;a href="https://interaktiv.tagesspiegel.de/lab/der-berliner-mamdani-effekt-jung-migrantisch-zentrumsnah-wo-die-linke-stark-geworden-ist/"&gt;Tagesspiegel / Julius Kölzer&lt;/a&gt;.&lt;/div&gt;

# Turnout is back.
&lt;html&gt;&lt;div style='float:left'&gt;&lt;/div&gt;&lt;hr color='#EB811B' size=1px style="width:1000px; margin:auto;"/&gt;&lt;/html&gt;


---
# Turnout is back. The East now votes more than the West.

.fig[&lt;img src="pics/analysis/04_turnout.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- East German turnout fell to the low 50s in the 2000s and 2010s
- 2026: &lt;b style="color:#cc0065"&gt;78%&lt;/b&gt; in MV and Saxony-Anhalt, 74% in Berlin
- Saxony-Anhalt: &lt;b style="color:#cc0065"&gt;+17.5&lt;/b&gt; points, the largest increase at any state election since 1990
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://juliuskoelzer.de/saxony-anhalt-2026-en/"&gt;Julius Kölzer&lt;/a&gt;.&lt;/div&gt;


---
# ... and the new voters went mostly one way

.fig[&lt;img src="pics/analysis/04_nonvoter_flows.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- S-A: AfD &lt;b style="color:#cc0065"&gt;+170k&lt;/b&gt; from former non-voters, all other parties together +96k
- Berlin is the exception: the Linke mobilised more (+75k) than the AfD (+61k)
- Centre and left mostly &lt;b style="color:#cc0065"&gt;trade votes among themselves&lt;/b&gt;; the AfD also takes from the CDU (−83k, −60k, −32k)
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.kas.de/de/monitor-wahl-und-sozialforschung"&gt;ARD / infratest dimap vote-flow analysis, via KAS Wahlanalysen&lt;/a&gt;, own compilation. Inspired by: &lt;a href="https://bsky.app/profile/juliusk.bsky.social/post/3mvz7smwnb22e"&gt;Julius Kölzer&lt;/a&gt;.&lt;/div&gt;


---
# ... and they are probably not going away any time soon

.fig[&lt;img src="pics/analysis/04_turnout_persistence.png"&gt;]

.notes[
&lt;div class="ta"&gt;Take-aways&lt;/div&gt;

- 226 state-election pairs since 1946: only about &lt;b style="color:#cc0065"&gt;one sixth&lt;/b&gt; of a turnout surge is given back next time
- Every East German surge since 2014 was followed by a &lt;b style="color:#cc0065"&gt;further rise&lt;/b&gt;
- Voting is habit-forming: &lt;b style="color:#cc0065"&gt;+5 to +15&lt;/b&gt; points next time, strongest for first-time voters
]

&lt;div class="src"&gt;Data: &lt;a href="https://www.wahlrecht.de/ergebnisse/"&gt;wahlrecht.de&lt;/a&gt;, own compilation. Literature: &lt;a href="https://onlinelibrary.wiley.com/doi/10.1111/ajps.12210"&gt;Coppock &amp; Green 2016&lt;/a&gt;, &lt;a href="https://www.aeaweb.org/articles?id=10.1257/app.20140533"&gt;Fujiwara, Meng &amp; Vogl 2016&lt;/a&gt;, &lt;a href="https://link.springer.com/chapter/10.1007/978-3-658-42694-1_4"&gt;Schäfer 2023&lt;/a&gt;.&lt;/div&gt;
